apiVersion: v2
name: three-tier-app
description: Umbrella Helm chart for 3-tier application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: frontend
    version: 0.1.0
    repository: "file://charts/frontend"
    condition: frontend.enabled
  - name: api
    version: 0.1.0
    repository: "file://charts/api"
    condition: api.enabled
  - name: database
    version: 0.1.0
    repository: "file://charts/database"
    condition: database.enabled
