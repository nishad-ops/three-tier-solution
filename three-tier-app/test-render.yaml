---
# Source: three-tier-app/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: three-tier-app-three-tier-app-db-isolation
  labels:
    helm.sh/chart: three-tier-app
    app.kubernetes.io/instance: three-tier-app
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: database
      app.kubernetes.io/instance: three-tier-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
              app.kubernetes.io/instance: three-tier-app
      ports:
        - protocol: TCP
          port: 3306

# Enforces network isolation: Database accepts ingress only from API pods.
