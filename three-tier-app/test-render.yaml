---
# Source: three-tier-app/charts/api/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: three-tier-app-api
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: three-tier-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: three-tier-app
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        app.kubernetes.io/instance: three-tier-app
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: three-tier-app-api-sa
      containers:
        - name: api
          image: "python:3.11-alpine"
          command: ["python", "-c", "import os, time; print('Flask connected to DB:', os.getenv('DB_HOST')); time.sleep(86400)"]
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: "three-tier-app-database"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials-synced
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials-synced
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials-synced
                  key: DB_NAME
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "three-tier-app-three-tier-app-kv-sync"

