---
# Source: three-tier-app/charts/database/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: three-tier-app-database
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: three-tier-app
spec:
  serviceName: three-tier-app-database
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: database
      app.kubernetes.io/instance: three-tier-app
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: three-tier-app
    spec:
      containers:
        - name: mysql
          image: "mysql:8.0"
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials-synced
                  key: DB_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: db-credentials-synced
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials-synced
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials-synced
                  key: DB_PASSWORD
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: datadir
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: datadir
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "default"
        resources:
          requests:
            storage: "5Gi"
---
# Source: three-tier-app/templates/ingress.yaml
# path based routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: three-tier-app-three-tier-app-ingress
  labels:
    helm.sh/chart: three-tier-app
    app.kubernetes.io/instance: three-tier-app
    app.kubernetes.io/managed-by: Helm
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: three-tier-app-three-tier-app-api
                port:
                  number: 5000
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: three-tier-app-three-tier-app-frontend
                port:
                  number: 80
---
# Source: three-tier-app/charts/api/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: three-tier-app-api-sa
  # Because pre-install hooks run before standard manifests are created, Helm needs the SecretProviderClass and ServiceAccount to exist when the hook executes.
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    azure.workload.identity/client-id: "360cb7f4-7526-4ce8-ac34-4421800c0349"
  labels:
    azure.workload.identity/use: "true"
    
---
# Source: three-tier-app/templates/hooks/migration-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: three-tier-app-three-tier-app-db-migration-1
  labels:
    helm.sh/chart: three-tier-app
    app.kubernetes.io/instance: three-tier-app
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: three-tier-app-api-sa
      containers:
        - name: db-migration-task
          image: python:3.11-alpine
          command:
            - "sh"
            - "-c"
            - |
              DB_USER=$(cat /mnt/secrets-store/db-user)
              DB_PASSWORD=$(cat /mnt/secrets-store/db-password)
              DB_NAME=$(cat /mnt/secrets-store/db-name)

              echo "Connecting to MySQL at $DB_HOST:$DB_PORT as user $DB_USER..."
              echo "Applying database schema migrations to database $DB_NAME..."
              sleep 3
              echo "Migration complete."
          env:
            - name: DB_HOST
              value: "three-tier-app-three-tier-app-database"
            - name: DB_PORT
              value: "3306"
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "three-tier-app-three-tier-app-kv-sync"
---
# Source: three-tier-app/templates/secretproviderclass.yaml
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: three-tier-app-three-tier-app-kv-sync
  labels:
    helm.sh/chart: three-tier-app
    app.kubernetes.io/instance: three-tier-app
    app.kubernetes.io/managed-by: Helm
    
  # Because pre-install hooks run before standard manifests are created, Helm needs the SecretProviderClass and ServiceAccount to exist when the hook executes.
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "360cb7f4-7526-4ce8-ac34-4421800c0349"
    keyvaultName: "app3tier-kv-cheap"
    tenantId: "2fb59b62-b476-47e9-ad98-51d00062c381"
    objects: |
      array:
        - |
          objectName: db-user
          objectType: secret
        - |
          objectName: db-password
          objectType: secret
        - |
          objectName: db-name
          objectType: secret
  secretObjects:
    - secretName: db-credentials-synced
      type: Opaque
      data:
        - objectName: db-user
          key: DB_USER
        - objectName: db-password
          key: DB_PASSWORD
        - objectName: db-name
          key: DB_NAME
