apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "three-tier.fullname" . }}-db-isolation
  labels:
    {{- include "three-tier.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: database
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: {{ .Values.database.service.port }}

# Enforces network isolation: Database accepts ingress only from API pods.